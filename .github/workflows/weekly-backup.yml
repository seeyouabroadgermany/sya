# Weekly encrypted copy of the CRM database, kept outside Supabase.
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_DB_URL     Supabase > Connect > Session pooler connection string (with your DB password)
#   BACKUP_PASSPHRASE   a long passphrase you keep in your password manager (needed to open the backup)
# The backup is saved as a private workflow artifact for 90 days. See README "Backups".
name: Weekly database backup

on:
  schedule:
    - cron: "30 20 * * 0" # Monday 02:00 India time
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check secrets are set
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DB_URL" ] || [ -z "$PASSPHRASE" ]; then
            echo "::error::Add SUPABASE_DB_URL and BACKUP_PASSPHRASE as repository secrets first."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dump roles, schema and data
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir backup
          npx --yes supabase@2.122.0 db dump --db-url "$DB_URL" -f backup/roles.sql --role-only
          npx --yes supabase@2.122.0 db dump --db-url "$DB_URL" -f backup/schema.sql
          npx --yes supabase@2.122.0 db dump --db-url "$DB_URL" -f backup/data.sql --use-copy --data-only

      - name: Compress and encrypt
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          STAMP=$(date -u +%Y-%m-%d)
          tar -czf "syb-crm-$STAMP.tar.gz" -C backup roles.sql schema.sql data.sql
          gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$PASSPHRASE" \
            -o "syb-crm-$STAMP.tar.gz.gpg" "syb-crm-$STAMP.tar.gz"
          rm -rf backup "syb-crm-$STAMP.tar.gz"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: syb-crm-backup-${{ env.STAMP }}
          path: syb-crm-*.tar.gz.gpg
          retention-days: 90
          if-no-files-found: error
